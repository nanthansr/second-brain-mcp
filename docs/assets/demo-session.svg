  <text x="390" y="26" fill="#8b949e" text-anchor="middle" font-size="12">second-brain-mcp - live session</text>
  <g fill="#c9d1d9">
    <text x="28" y="62"><tspan fill="#7ee787">&#10095;</tspan> using the second-brain tools, what is Alex Rivera working on</text>
