    <text x="28" y="116" fill="#79c0ff">  &#9881; get_index()                                      <tspan fill="#8b949e">index.md, 4 sections</tspan></text>
    <text x="28" y="138" fill="#79c0ff">  &#9881; read_note("wiki/me.md")                          <tspan fill="#d29922">read 1/5</tspan></text>
    <text x="28" y="160" fill="#79c0ff">  &#9881; read_note("wiki/projects/kite-weather-app.md")   <tspan fill="#d29922">read 2/5</tspan></text>
    <text x="28" y="182" fill="#79c0ff">  &#9881; read_note("wiki/people/sam-okafor.md")           <tspan fill="#d29922">read 3/5</tspan></text>
    <text x="28" y="216">  Alex Rivera (29, product engineer, Lisbon) is shipping</text>
    <text x="28" y="238">  <tspan fill="#7ee787">Kite Weather App</tspan> - hyperlocal wind forecasts for kitesurfers.</text>
    <text x="28" y="260">  34 beta testers, day-7 retention 38%. Open decision:</text>
